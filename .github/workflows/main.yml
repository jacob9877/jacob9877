name: Deploy FastAPI to AWS Lambda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy FastAPI with Layer to AWS Lambda
    runs-on: ubuntu-latest

    env:
      LAMBDA_FUNCTION_NAME: AI-for-Bariatric-Surgery_API
      LAYER_NAME: API-Lambda-Layer
      REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Package Lambda Layer (dependencies)
        run: |
          mkdir -p layer/python
          pip install --upgrade pip
          pip install -r requirements.txt --target layer/python
          cd layer
          zip -r ../layer.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Publish Lambda Layer
        id: publish_layer
        run: |
          LAYER_VERSION=$(aws lambda publish-layer-version \
            --layer-name $LAYER_NAME \
            --zip-file fileb://layer.zip \
            --compatible-runtimes python3.11 \
            --query 'Version' --output text)
          echo "LAYER_VERSION=$LAYER_VERSION" >> $GITHUB_ENV

      - name: Package application code only
        run: |
          mkdir -p app_package
          cp -r app app_package/
          cd app_package
          zip -r ../app_package.zip .

      - name: Deploy application code to Lambda
        run: |
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION_NAME \
            --zip-file fileb://app_package.zip

      - name: Attach layer to Lambda
        run: |
          aws lambda update-function-configuration \
            --function-name $LAMBDA_FUNCTION_NAME \
            --layers arn:aws:lambda:${{ env.REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:layer:${{ env.LAYER_NAME }}:${{ env.LAYER_VERSION }}
