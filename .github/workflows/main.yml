name: Deploy FastAPI Lambda Container

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_REPOSITORY_NAME }}
        run: |
          set -euo pipefail
          IMAGE_SHA_URI="$ECR_REGISTRY/$REPO:${{ github.sha }}"
          IMAGE_LATEST_URI="$ECR_REGISTRY/$REPO:latest"

          # Pin platform for Lambda if needed
          docker build --platform linux/amd64 -t "$IMAGE_SHA_URI" -t "$IMAGE_LATEST_URI" .
          docker push "$IMAGE_SHA_URI"
          docker push "$IMAGE_LATEST_URI"

      - name: Deploy, set PC on VERSION, poll READY, repoint alias, and hard cleanup
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
          REPO: ${{ secrets.ECR_REPOSITORY_NAME }}
        run: |
          set -euo pipefail

          IMAGE_URI="$ECR_REGISTRY/$REPO:${{ github.sha }}"
          ALIAS_NAME="v2"
          PC=1

          echo "0) Pre-clean: delete alias PC (idempotent) to avoid conflicts…"
          aws lambda delete-provisioned-concurrency-config \
            --function-name "$FUNCTION_NAME" \
            --qualifier "$ALIAS_NAME" || true

          # Wait until alias PC is fully gone (eventual consistency guard)
          for i in $(seq 1 30); do
            STATUS=$(aws lambda get-provisioned-concurrency-config \
              --function-name "$FUNCTION_NAME" \
              --qualifier "$ALIAS_NAME" \
              --query 'Status' --output text 2>/dev/null || echo "MISSING")
            [ "$STATUS" = "MISSING" ] && break
            echo "Alias PC still present (status=$STATUS), rechecking…"
            sleep 2
          done

          echo "1) Update code & publish version…"
          VERSION=$(
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --image-uri "$IMAGE_URI" \
              --publish \
              --query 'Version' \
              --output text
          )
          echo "Published version: $VERSION"

          echo "2) Wait for version to be ACTIVE…"
          aws lambda wait published-version-active \
            --function-name "$FUNCTION_NAME" \
            --qualifier "$VERSION"

          echo "3) Set provisioned concurrency ($PC) on VERSION $VERSION…"
          aws lambda put-provisioned-concurrency-config \
            --function-name "$FUNCTION_NAME" \
            --qualifier "$VERSION" \
            --provisioned-concurrent-executions "$PC"

          echo "4) Poll until PC is READY…"
          ATTEMPTS=60
          SLEEP_SECS=10
          for i in $(seq 1 $ATTEMPTS); do
            STATUS=$(aws lambda get-provisioned-concurrency-config \
              --function-name "$FUNCTION_NAME" \
              --qualifier "$VERSION" \
              --query 'Status' \
              --output text 2>/dev/null || echo "MISSING")
            if [ "$STATUS" = "READY" ]; then
              echo "Provisioned concurrency is READY."
              break
            elif [ "$STATUS" = "FAILED" ]; then
              REASON=$(aws lambda get-provisioned-concurrency-config \
                --function-name "$FUNCTION_NAME" \
                --qualifier "$VERSION" \
                --query 'StatusReason' \
                --output text || true)
              echo "ERROR: Provisioned concurrency FAILED: $REASON"
              exit 1
            else
              echo "Status=$STATUS; retrying in ${SLEEP_SECS}s… ($i/$ATTEMPTS)"
              sleep "$SLEEP_SECS"
            fi
          done

          echo "5) Point alias '$ALIAS_NAME' -> version $VERSION (no weighted routing)…"
          if aws lambda get-alias --function-name "$FUNCTION_NAME" --name "$ALIAS_NAME" >/dev/null 2>&1; then
            aws lambda update-alias \
              --function-name "$FUNCTION_NAME" \
              --name "$ALIAS_NAME" \
              --function-version "$VERSION" \
              --routing-config 'AdditionalVersionWeights={}'
          else
            aws lambda create-alias \
              --function-name "$FUNCTION_NAME" \
              --name "$ALIAS_NAME" \
              --function-version "$VERSION"
          fi

          echo "6) HARD CLEANUP: delete ALL other PC configs except version $VERSION…"
          # Loop to defeat eventual consistency: re-list and re-delete until none remain
          for round in $(seq 1 5); do
            OTHER_PCS=$(aws lambda list-provisioned-concurrency-configs \
              --function-name "$FUNCTION_NAME" \
              --query "ProvisionedConcurrencyConfigs[?Qualifier!='${VERSION}'].Qualifier" \
              --output text || true)

            if [ -z "$OTHER_PCS" ]; then
              echo "No extra PC configs remain. Cleanup complete."
              break
            fi

            echo "Found extra PC configs (round $round): $OTHER_PCS"
            for q in $OTHER_PCS; do
              echo "Deleting PC on qualifier: $q"
              aws lambda delete-provisioned-concurrency-config \
                --function-name "$FUNCTION_NAME" \
                --qualifier "$q" || true
            done

            # Small backoff before re-listing
            sleep 3
          done

          echo "Done. Alias '$ALIAS_NAME' -> version $VERSION; ONLY PC on version $VERSION remains."
