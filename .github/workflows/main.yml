name: Deploy FastAPI Lambda Container

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPO_NAME: ${{ secrets.ECR_REPOSITORY_NAME }}
        run: |
          set -euo pipefail
          IMAGE_SHA_URI="$ECR_REGISTRY/$ECR_REPO_NAME:${{ github.sha }}"
          IMAGE_LATEST_URI="$ECR_REGISTRY/$ECR_REPO_NAME:latest"

          docker build --platform linux/amd64 -t "$IMAGE_SHA_URI" -t "$IMAGE_LATEST_URI" .
          docker push "$IMAGE_SHA_URI"
          docker push "$IMAGE_LATEST_URI"

      - name: Deploy, set PC on VERSION, repoint alias, and deep-prune PC
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
          ECR_REPO_NAME: ${{ secrets.ECR_REPOSITORY_NAME }}
          ALIAS_NAME: ${{ secrets.LAMBDA_ALIAS_NAME }}
          PC: ${{ secrets.LAMBDA_PROVISIONED_CONCURRENCY }}
        run: |
          set -euo pipefail

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPO_NAME:${{ github.sha }}"

          echo "0) Pre-clean: delete alias-level provisioned concurrency config for '$ALIAS_NAME' (if any)..."
          aws lambda delete-provisioned-concurrency-config \
            --function-name "$FUNCTION_NAME" \
            --qualifier "$ALIAS_NAME" || true

          # Wait until that PC config is really gone and its status is 'MISSING'
          for i in $(seq 1 30); do
            STATUS=$(aws lambda get-provisioned-concurrency-config \
              --function-name "$FUNCTION_NAME" \
              --qualifier "$ALIAS_NAME" \
              --query 'Status' --output text 2>/dev/null || echo "MISSING")
            [ "$STATUS" = "MISSING" ] && break
            echo "Provisioned concurrency still present on alias: (status=$STATUS); waiting…"
            sleep 2
          done

          echo "1) Update Lambda function code with image & publish new version..."
          VERSION=$(aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --image-uri "$IMAGE_URI" \
            --publish \
            --query 'Version' --output text)
          echo "Published version: $VERSION"

          echo "2) Wait for version to be ACTIVE…"
          aws lambda wait published-version-active \
            --function-name "$FUNCTION_NAME" \
            --qualifier "$VERSION"

          echo "3) Set provisioned concurrency ($PC) on version $VERSION..."
          aws lambda put-provisioned-concurrency-config \
            --function-name "$FUNCTION_NAME" \
            --qualifier "$VERSION" \
            --provisioned-concurrent-executions "$PC"

          echo "4) Poll provisioned concurrency config on $VERSION until READY..."
          ATTEMPTS=60
          SLEEP_SECS=10
          for i in $(seq 1 $ATTEMPTS); do
            STATUS=$(aws lambda get-provisioned-concurrency-config \
              --function-name "$FUNCTION_NAME" \
              --qualifier "$VERSION" \
              --query 'Status' --output text 2>/dev/null || echo "MISSING")
            if [ "$STATUS" = "READY" ]; then
              echo "Provisioned concurrency is READY."
              break
            elif [ "$STATUS" = "FAILED" ]; then
              REASON=$(aws lambda get-provisioned-concurrency-config \
                --function-name "$FUNCTION_NAME" \
                --qualifier "$VERSION" \
                --query 'StatusReason' --output text || true)
              echo "ERROR: PC FAILED: $REASON"
              exit 1
            else
              echo "Status=$STATUS; retrying in ${SLEEP_SECS}s... ($i/$ATTEMPTS)"
              sleep "$SLEEP_SECS"
            fi
          done

          echo "5) Point alias '$ALIAS_NAME' to version $VERSION (no weights)..."
          if aws lambda get-alias --function-name "$FUNCTION_NAME" --name "$ALIAS_NAME" >/dev/null 2>&1; then
            aws lambda update-alias \
              --function-name "$FUNCTION_NAME" \
              --name "$ALIAS_NAME" \
              --function-version "$VERSION" \
              --routing-config 'AdditionalVersionWeights={}'
          else
            aws lambda create-alias \
              --function-name "$FUNCTION_NAME" \
              --name "$ALIAS_NAME" \
              --function-version "$VERSION"
          fi

          echo "6) Deep prune ALL other provisioned concurrency configs (versions & aliases)..."

          prune_pc() {
            local keep="$1"
            local did_delete=false
            local marker=""

            while : ; do
              if [ -z "$marker" ]; then
                resp=$(aws lambda list-provisioned-concurrency-configs \
                  --function-name "$FUNCTION_NAME" \
                  --output json 2>/dev/null || echo '{"ProvisionedConcurrencyConfigs":[]}')
              else
                resp=$(aws lambda list-provisioned-concurrency-configs \
                  --function-name "$FUNCTION_NAME" \
                  --marker "$marker" \
                  --output json 2>/dev/null || echo '{"ProvisionedConcurrencyConfigs":[]}')
              fi

              # Extract qualifier as the last ARN segment (handles versions AND aliases)
              QUALIFIERS=$(echo "$resp" | jq -r --arg K "$keep" '
                .ProvisionedConcurrencyConfigs
                | map((.FunctionArn | split(":")[-1]) // empty)
                | map(select(. != "" and . != $K))
                | unique
                | .[]?
              ')

              NEXT=$(echo "$resp" | jq -r '.NextMarker // empty')

              if [ -n "$QUALIFIERS" ]; then
                while IFS= read -r q; do
                  # sanity guard
                  if [ -z "$q" ] || [ "$q" = "null" ]; then
                    echo "Skipping bogus qualifier: '$q'"
                    continue
                  fi
                  echo "Deleting provisioned concurrency config on qualifier: $q"
                  aws lambda delete-provisioned-concurrency-config \
                    --function-name "$FUNCTION_NAME" \
                    --qualifier "$q" || true

                  did_delete=true

                  # Wait until that provisioned concurrency config is really gone
                  for i in $(seq 1 30); do
                    STATUS=$(aws lambda get-provisioned-concurrency-config \
                      --function-name "$FUNCTION_NAME" \
                      --qualifier "$q" \
                      --query 'Status' --output text 2>/dev/null || echo "MISSING")
                    [ "$STATUS" = "MISSING" ] && break
                    sleep 2
                  done
                done <<< "$QUALIFIERS"
              fi

              [ -z "$NEXT" ] && break
              marker="$NEXT"
            done

            # One extra pass if we deleted anything (eventual consistency)
            if $did_delete; then
              echo "Re-running prune to defeat eventual consistency..."
              prune_pc "$keep"
            fi
          }

          # Run prune, keeping only the freshly published version
          prune_pc "$VERSION"

          echo "7) Assert only the new version still has provisioned concurrency..."
          EXTRA_COUNT=$(
            aws lambda list-provisioned-concurrency-configs \
              --function-name "$FUNCTION_NAME" \
              --output json 2>/dev/null \
            | jq -r --arg K "$VERSION" '
                .ProvisionedConcurrencyConfigs
                | map((.FunctionArn | split(":")[-1]) // empty)
                | map(select(. != "" and . != $K))
                | length
              '
          )
          if [ "${EXTRA_COUNT:-0}" -ne 0 ]; then
            echo "ERROR: Found ${EXTRA_COUNT} extra provisioned concurrency configs after prune."
            echo "Remaining configs:"
            aws lambda list-provisioned-concurrency-configs \
              --function-name "$FUNCTION_NAME" \
              --output json | jq -r '.'
            exit 1
          fi

          echo "Cleanup verified: only version $VERSION has provisioned concurrency."
