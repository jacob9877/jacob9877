name: Deploy FastAPI Lambda Container

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          REPO="${{ secrets.ECR_REPOSITORY_NAME }}"
          IMAGE_SHA_URI="$ECR_REGISTRY/$REPO:${{ github.sha }}"
          IMAGE_LATEST_URI="$ECR_REGISTRY/$REPO:latest"

          docker build -t "$IMAGE_SHA_URI" -t "$IMAGE_LATEST_URI" .
          docker push "$IMAGE_SHA_URI"
          docker push "$IMAGE_LATEST_URI"

      - name: Deploy, set PC on VERSION, poll READY, repoint alias v2, and cleanup
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          FUNCTION_NAME="${{ secrets.LAMBDA_FUNCTION_NAME }}"
          REPO="${{ secrets.ECR_REPOSITORY_NAME }}"
          IMAGE_URI="$ECR_REGISTRY/$REPO:${{ github.sha }}"
          ALIAS_NAME="v2"
          PC=1

          echo "Update code & publish version…"
          VERSION=$(
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --image-uri "$IMAGE_URI" \
              --publish \
              --query 'Version' \
              --output text
          )
          echo "Published version: $VERSION"

          # Wait for the published version to be active
          echo "Waiting for published version to become ACTIVE…"
          aws lambda wait published-version-active \
            --function-name "$FUNCTION_NAME" \
            --qualifier "$VERSION"

          echo "Set provisioned concurrency ($PC) on VERSION $VERSION…"
          aws lambda put-provisioned-concurrency-config \
            --function-name "$FUNCTION_NAME" \
            --qualifier "$VERSION" \
            --provisioned-concurrent-executions "$PC"

          # Poll until PC status is READY or FAILED (no official waiter exists)
          echo "Polling provisioned concurrency status for VERSION $VERSION…"
          ATTEMPTS=60   # ~10 minutes max
          SLEEP_SECS=10
          for i in $(seq 1 $ATTEMPTS); do
            STATUS=$(aws lambda get-provisioned-concurrency-config \
              --function-name "$FUNCTION_NAME" \
              --qualifier "$VERSION" \
              --query 'Status' \
              --output text 2>/dev/null || echo "MISSING")
            if [ "$STATUS" = "READY" ]; then
              echo "Provisioned concurrency is READY."
              break
            elif [ "$STATUS" = "FAILED" ]; then
              REASON=$(aws lambda get-provisioned-concurrency-config \
                --function-name "$FUNCTION_NAME" \
                --qualifier "$VERSION" \
                --query 'StatusReason' \
                --output text || true)
              echo "ERROR: Provisioned concurrency FAILED: $REASON"
              exit 1
            else
              echo "Status=$STATUS; retrying in ${SLEEP_SECS}s… ($i/$ATTEMPTS)"
              sleep "$SLEEP_SECS"
            fi
          done

          # Ensure alias exists, no weights, and points to new version
          echo "Ensure alias '$ALIAS_NAME' points to version $VERSION with no weighted routing…"
          if aws lambda get-alias --function-name "$FUNCTION_NAME" --name "$ALIAS_NAME" >/dev/null 2>&1; then
            aws lambda update-alias \
              --function-name "$FUNCTION_NAME" \
              --name "$ALIAS_NAME" \
              --function-version "$VERSION" \
              --routing-config 'AdditionalVersionWeights={}'
          else
            aws lambda create-alias \
              --function-name "$FUNCTION_NAME" \
              --name "$ALIAS_NAME" \
              --function-version "$VERSION"
          fi

          echo "CLEANUP: remove PC from alias (if any) and from all other versions…"
          # Delete PC on alias if previously set (ignore if not found)
          aws lambda delete-provisioned-concurrency-config \
            --function-name "$FUNCTION_NAME" \
            --qualifier "$ALIAS_NAME" || true

          # Remove PC from any qualifier other than the new version
          OTHER_PCS=$(aws lambda list-provisioned-concurrency-configs \
            --function-name "$FUNCTION_NAME" \
            --query "ProvisionedConcurrencyConfigs[?Qualifier!='${VERSION}'].Qualifier" \
            --output text || true)
          for q in $OTHER_PCS; do
            echo "Deleting PC on qualifier: $q"
            aws lambda delete-provisioned-concurrency-config \
              --function-name "$FUNCTION_NAME" \
              --qualifier "$q" || true
          done

          echo "Done. Alias '$ALIAS_NAME' -> version $VERSION; PC=$PC on the version; old PC cleaned up."
