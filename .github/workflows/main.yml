          # while read -r VER MOD; do
          #   if [ "$VER" = "$VERSION" ]; then continue; fi
          #   if echo "$CURRENT_ALIASED" | grep -qx "$VER"; then continue; fi
          #   KEEP_COUNT=$((KEEP_COUNT+1))
          #   if [ $KEEP_COUNT -le 5 ]; then continue; fi
