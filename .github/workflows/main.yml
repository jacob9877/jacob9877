name: Deploy FastAPI Lambda Container

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          REPO="${{ secrets.ECR_REPOSITORY_NAME }}"
          IMAGE_SHA_URI="$ECR_REGISTRY/$REPO:${{ github.sha }}"
          IMAGE_LATEST_URI="$ECR_REGISTRY/$REPO:latest"

          docker build -t "$IMAGE_SHA_URI" -t "$IMAGE_LATEST_URI" .
          docker push "$IMAGE_SHA_URI"
          docker push "$IMAGE_LATEST_URI"

      - name: Deploy, set PC on VERSION, repoint alias v2, and cleanup
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          FUNCTION_NAME="${{ secrets.LAMBDA_FUNCTION_NAME }}"
          REPO="${{ secrets.ECR_REPOSITORY_NAME }}"
          IMAGE_URI="$ECR_REGISTRY/$REPO:${{ github.sha }}"
          ALIAS_NAME="v2"
          PC=1

          echo "Update code & publish version…"
          VERSION=$(
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --image-uri "$IMAGE_URI" \
              --publish \
              --query 'Version' \
              --output text
          )
          echo "Published version: $VERSION"
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"

          echo "Set provisioned concurrency ($PC) on VERSION $VERSION…"
          aws lambda put-provisioned-concurrency-config \
            --function-name "$FUNCTION_NAME" \
            --qualifier "$VERSION" \
            --provisioned-concurrent-executions "$PC"
          aws lambda wait provisioned-concurrency-config-ready \
            --function-name "$FUNCTION_NAME" \
            --qualifier "$VERSION"

          echo "Ensure alias exists and has NO weighted routing; point to $VERSION…"
          if aws lambda get-alias --function-name "$FUNCTION_NAME" --name "$ALIAS_NAME" >/dev/null 2>&1; then
            aws lambda update-alias \
              --function-name "$FUNCTION_NAME" \
              --name "$ALIAS_NAME" \
              --function-version "$VERSION" \
              --routing-config 'AdditionalVersionWeights={}'
          else
            aws lambda create-alias \
              --function-name "$FUNCTION_NAME" \
              --name "$ALIAS_NAME" \
              --function-version "$VERSION"
          fi

          echo "CLEANUP: remove PC from alias (if any) to avoid conflicts…"
          # Delete PC on alias if previously set (ignore if not found)
          aws lambda delete-provisioned-concurrency-config \
            --function-name "$FUNCTION_NAME" \
            --qualifier "$ALIAS_NAME" || true

          echo "CLEANUP: remove PC from all other versions…"
          # Get all qualifiers with PC and drop anything that's not the new VERSION
          OTHER_PCS=$(aws lambda list-provisioned-concurrency-configs \
            --function-name "$FUNCTION_NAME" \
            --query "ProvisionedConcurrencyConfigs[?Qualifier!='${VERSION}'].Qualifier" \
            --output text || true)
          for q in $OTHER_PCS; do
            echo "Deleting PC on qualifier: $q"
            aws lambda delete-provisioned-concurrency-config \
              --function-name "$FUNCTION_NAME" \
              --qualifier "$q" || true
          done

          echo "CLEANUP COMPLETE. Alias '$ALIAS_NAME' -> version $VERSION; PC=$PC on version only."

          # OPTIONAL: prune old versions (keep the last 5 and any referenced by aliases)
          # Uncomment if you want automated pruning.
          #
          # echo "Optional prune: delete old versions not referenced by any alias (keeping 5 most recent)…"
          # CURRENT_ALIASED=$(aws lambda list-aliases --function-name "$FUNCTION_NAME" --query 'Aliases[].FunctionVersion' --output text | tr '\t' '\n' | sort -u)
          # ALL_VERSIONS=$(aws lambda list-versions-by-function --function-name "$FUNCTION_NAME" --query 'Versions[?Version!=`$LATEST`].[Version,LastModified]' --output text | sort -k2 -r)
