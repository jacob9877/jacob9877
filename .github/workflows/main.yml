name: Deploy FastAPI to Lambda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build Layer and Deploy Function
    runs-on: ubuntu-latest

    env:
      LAMBDA_FUNCTION_NAME: AI-for-Bariatric-Surgery_API
      LAYER_NAME: FastAPI-Dependencies
      ZIP_FILE: lambda_package.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies for layer
        run: |
          mkdir -p python
          pip install -r requirements.txt -t python/

      - name: Zip dependencies as Lambda layer
        run: zip -r layer.zip python

      - name: Zip FastAPI application (code only)
        run: zip $ZIP_FILE app.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Publish Lambda layer version
        run: |
          aws lambda publish-layer-version \
            --layer-name $LAYER_NAME \
            --zip-file fileb://layer.zip \
            --compatible-runtimes python3.11 \
            --output json > layer_output.json

      - name: Extract Layer ARN
        id: extract-layer
        run: |
          echo "LAYER_ARN=$(jq -r .LayerVersionArn layer_output.json)" >> $GITHUB_ENV

      - name: Deploy Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION_NAME \
            --zip-file fileb://$ZIP_FILE

      - name: Attach new layer version to function
        run: |
          aws lambda update-function-configuration \
            --function-name $LAMBDA_FUNCTION_NAME \
            --layers ${{ env.LAYER_ARN }}
